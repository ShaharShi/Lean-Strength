name: Deploy Lean Strength to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Download exercise photos (public domain)
        run: python3 fetch_figs.py figs
      - name: Build static site
        run: python3 build_site.py dist
      # GitHub Pages is served from the gh-pages branch (Settings → Pages → Deploy from a branch).
      # Publishing by pushing that branch needs only the default GITHUB_TOKEN; enabling Pages
      # through actions/configure-pages requires admin rights the token does not have.
      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Lean Strength site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
